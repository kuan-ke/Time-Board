<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CH 多人計時器</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div id="app">

  <header class="top-bar">
    <div class="top-bar-left">
      <h1>CH 多人計時器</h1>
      <div id="onlineUsersBar" class="online-users-bar">
        <span class="online-label">🟢 線上 <span id="onlineCount">0</span> 人：</span>
        <span id="onlineNames" class="online-names"></span>
      </div>
    </div>
    <div class="top-bar-right">
      <button id="pipBtn" class="admin-btn" title="開啟子母畫面（浮動在最上層的小視窗）">📺 子母畫面</button>
      <span id="myNicknameDisplay" class="my-nickname"></span>
      <button id="adminEditSelfBtn" class="admin-btn hidden" title="管理者：修改自己的暱稱">✎</button>
      <div id="connStatus" class="conn-status">連線中...</div>
    </div>
  </header>

  <div id="adminPanel" class="admin-panel hidden">
    <span class="admin-panel-title">🔑 管理者：</span>
    <div id="adminUserList" class="admin-user-list"></div>
    <span class="admin-panel-title" id="adminMutedTitle" style="margin-left:14px;">🚫 已禁止操作：</span>
    <div id="adminMutedList" class="admin-user-list"></div>
  </div>

  <div class="main-row">
    <div class="main-left">
      <div class="tabs-row">
        <div id="tabsList" class="tabs-list"></div>
        <button id="addTabBtn" class="add-tab-btn" title="新增分頁">＋</button>
      </div>

      <div class="boss-range-row">
        <div class="boss-info">
          <img id="bossImage" class="boss-image hidden" alt="" />
          <div id="bossName" class="boss-name"></div>
        </div>
        <div class="range-panel">
          <label>最小值(分)<input type="number" id="minInput" min="1" /></label>
          <label>最大值(分)<input type="number" id="maxInput" min="1" /></label>
          <span class="range-hint" id="rangeHint">CH 可右鍵自訂覆蓋</span>
        </div>
        <div class="legend">
          <span class="legend-item"><span class="dot idle"></span>待機</span>
          <span class="legend-item"><span class="dot counting"></span>倒數中</span>
          <span class="legend-item"><span class="dot appearing"></span>出現中</span>
        </div>
      </div>

      <div class="grid-wrapper">
        <div id="grid" class="grid"></div>
      </div>
    </div>

    <div class="main-right">
      <div class="panel active-panel">
        <div class="panel-title-row">
          <div class="panel-title">📋 進行中頻道</div>
          <div class="view-toggle"><button data-view="boss" class="active" title="只看目前選的這隻王">本王</button><button data-view="all" title="所有王的進行中頻道">總頻道</button></div>
        </div>
        <div class="active-columns">
          <div class="active-sub-panel">
            <div class="sub-panel-title">⏳ 倒數中</div>
            <div id="statusListCounting" class="status-list scrollable">
              <div class="status-empty">目前沒有倒數中的 CH</div>
            </div>
          </div>
          <div class="active-sub-panel">
            <div class="sub-panel-title">🌟 出現中</div>
            <div id="statusListAppearing" class="status-list scrollable">
              <div class="status-empty">目前沒有出現中的 CH</div>
            </div>
          </div>
        </div>
      </div>
      <div class="panel log-panel">
        <div class="panel-title-row">
          <div class="panel-title">🗂 操作紀錄</div>
          <button id="adminClearLogBtn" class="admin-btn hidden" title="清空全部操作紀錄">清空紀錄</button>
        </div>
        <div id="logList" class="log-list scrollable">
          <div class="status-empty">尚無任何操作紀錄</div>
        </div>
      </div>
    </div>
  </div>

</div>

<!-- 暱稱設定：強制彈窗，未設定前無法操作 -->
<div id="nicknameOverlay" class="modal-overlay">
  <div class="modal">
    <h3>請先輸入您的暱稱</h3>
    <p class="modal-note">暱稱將顯示在您點擊的 CH 旁邊，讓大家知道是誰觸發倒數。<br />設定後將無法自行更改，請謹慎輸入。</p>
    <input type="text" id="nicknameInput" maxlength="20" placeholder="輸入暱稱..." />
    <div id="nicknameError" class="nickname-error hidden"></div>
    <div class="modal-buttons">
      <button id="nicknameSubmitBtn" class="btn-primary">確認</button>
    </div>
  </div>
</div>

<!-- 右鍵：設定 CH 倒數時間 -->
<div id="modalOverlay" class="modal-overlay hidden">
  <div class="modal">
    <h3 id="modalTitle">回報 CH 死亡時間</h3>
    <div class="time-input-row">
      <label class="time-input-label">
        時
        <input type="number" id="modalHour" min="0" max="23" />
      </label>
      <span class="time-colon">:</span>
      <label class="time-input-label">
        分
        <input type="number" id="modalMinute" min="0" max="59" />
      </label>
      <span class="time-24h-hint">（24小時制）</span>
    </div>
    <p class="modal-note" id="modalStateNote"></p>
    <div class="modal-buttons">
      <button id="modalResetBtn" class="btn-secondary">恢復待機</button>
      <button id="modalCancelBtn" class="btn-secondary">取消</button>
      <button id="modalSaveBtn" class="btn-primary">儲存</button>
    </div>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="client.js"></script>
</body>
</html>
